# PACC 后端统一消息（MessageSource 默认语言）。业务错误返回键的同时，用此文案供展示兜底。
error.badRequest=非法请求参数
error.validation=请求参数不合法
error.field.invalid=字段不合法: {0}
error.ratelimited=请求过于频繁，请稍后再试
error.unauthorized=认证失败或登录已过期
error.forbidden=无操作权限
error.notFound=资源不存在
error.internal=服务器内部错误，请稍后重试

# 领域业务提示
error.amount.invalid=金额参数不合法
error.list.empty=名单值不能为空
error.export.notReady=导出任务未就绪或下载凭证无效