server:
  port: 8080

spring:
  application:
    name: pacc-ptv-backend
  # 生产以 MySQL 为准；驱动由 Spring Boot 依据 URL 自动探测（无需显式 driver-class-name）。
  # 不设置 SPRING_DATASOURCE_URL 且未启用 local profile 时，应用将无法连接数据库而启动失败（fail-closed）。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pacc?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:pacc}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # SMTP：对公上线必须配真实邮件服务，否则密码找回无法发送（见 pacc.mail）。
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.from: ${SMTP_FROM:}
  jpa:
    hibernate:
      # 生产 schema 由 Flyway 迁移脚本管理，Hibernate 仅做结构校验（fail-closed 防漂移）
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  # Flyway：版本化数据库迁移。生产默认开启，schema 以 db/migration/*.sql 为准
  flyway:
    enabled: true
    baseline-on-migrate: true

pacc:
  security:
    # 对公发布：以下密钥必须经由环境变量注入，禁用内嵌默认值。
    # 任何一项为空/弱默认时，StartupSecretGuard 会在启动阶段直接抛错（fail-closed）。
    admin-api-key: ${PACC_SECURITY_ADMIN_API_KEY:}
    super-admin-key: ${PACC_SECURITY_SUPER_ADMIN_KEY:}
    jwt-secret: ${PACC_SECURITY_JWT_SECRET:}
    # 玩家端 WSS 上报签名密钥：非空时对上报消息做 HMAC 校验收紧（防重放/防篡改）。
    wss-sign-secret: ${PACC_SECURITY_WSS_SIGN_SECRET:}
    # 特征库热更新内容签名密钥：非 local 缺失时 SigSigner 启动即抛错（fail-closed）。
    sig-secret: ${PACC_SIG_SECRET:}
    # 管理后台允许的跨域来源（Origin 白名单，逗号分隔）。
    allowed-origins: "https://admin.potatotv.asia,http://admin.potatotv.asia,http://localhost:5173,https://localhost:5173"
  mail:
    # 仅 local 联调可开 stub；生产默认关闭（fail-closed：未配置真实 SMTP 时，找回邮件不实际发送）。
    stub-enabled: ${PACC_MAIL_STUB_ENABLED:false}
    # 密码重置邮件中使用的门户基地址（对公发布须为公网可访问的玩家门户地址）。
    reset-base-url: ${PACC_MAIL_RESET_BASE_URL:https://pacc.potatotv.asia}
  feishu:
    # 管理员飞书 OAuth：不启用则后台可只用超级管理员授权密钥登录。
    # 启用后默认拒绝所有飞书用户，须将其 open_id / 邮箱 / 手机号加入下方白名单才会放行。
    enabled: ${PACC_FEISHU_ENABLED:false}
    app-id: ${PACC_FEISHU_APP_ID:}
    app-secret: ${PACC_FEISHU_APP_SECRET:}
    super-admin-userids: ${PACC_FEISHU_SUPER_ADMIN_USERIDS:}
    admin-userids: ${PACC_FEISHU_ADMIN_USERIDS:}
  pteid:
    prefix: "PT"
  otp:
    # 邮箱/手机验证码有效性窗口与同目标最小重发间隔
    ttl-minutes: 10
    resend-seconds: 60
  detection:
    redscreen-threshold: 85        # 综合风险评分触发红屏阈值
    severe-threshold: 95           # 三级红屏阈值
    suspicious-low: 70             # 一级（可疑）下限
    cooldown-minutes: 10           # 同账号同类型红屏冷却
  countermeasure:
    # v4.5 硬件级作弊与完整性对抗的判定阈值（服务端可调，经 /api/admin/system/config 暴露）
    input-macro-cv: 0.06           # 点击间隔变异系数低于此值判为宏（人类 ~0.3-0.5）
    hardware-match-score: 70       # 命中高危硬件指纹的最低风险分
    integrity-suspect: 25          # 完整性轻微可疑（深观察）阈值
    integrity-tampered: 60         # 完整性严重破坏（直接红屏）阈值
    environment-suspect: 30        # DMA/IOMMU/调试环境轻微可疑（深观察）阈值
    environment-high: 60           # DMA/调试环境高危（加固+告警）阈值
  zero-day:
    # v4.6 零日外挂检测（无先验签名）：三路异常信号融合权重与尺度
    iso-weight: 0.5                # 孤立森林独离分数权重
    recon-weight: 0.3              # 线性自编码重构误差权重
    baseline-weight: 0.2           # 个人行为基线偏离权重
    recon-scale: 1.2               # 重构误差映射到 (0,1] 的尺度（越小对偏离越敏感）
    baseline-scale: 3.0            # 基线 z-score 偏离映射尺度
  websocket:
    endpoint: /ws                # 玩家端 WebSocket 长连接端点
  webhook:
    retry: 3
  ai:
    # AI 推理服务（Python / FastAPI，deploy/ai）。启用后风险评分按 15% 权重融合 AI 分
    enabled: false
    inference-url: http://ai:8000
  rules:
    # Lua 动态规则引擎（classpath:rules/*.lua，可热更新）
    enabled: true
    max-bonus: 15          # 规则命中加分上限

logging:
  level:
    # 默认 INFO（安全：不输出调试性敏感日志）
    com.potatotv.pacc: INFO
    # 统一访问日志（方法 / 路径 / 状态 / 耗时 / 来源 IP，已脱敏）
    ACCESS: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # SMTP 未配置（stub 模式）时不让 mail 探测器把 /health 打成 DOWN；配好真实 SMTP 后如需参与就绪检查可改回 true
    mail:
      enabled: false

springdoc:
  # OpenAPI 3.0 / Swagger UI 在线调试。默认关闭（安全加固），仅 local 开启；
  # 生产环境中如确需在线调试，设 PACC_SPRINGDOC_ENABLED=true 一并开启 api-docs 与 UI。
  api-docs:
    enabled: ${PACC_SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${PACC_SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
  info:
    title: PACC PTV 管控后端 API
    version: 5.0.0
    description: PACC 管理后台 / 玩家门户 / 开放 API 接口文档（仅功能描述，不含内部检测逻辑）
  # 仅扫描控制器包，避免把内部组件卷入文档
  packages-to-scan: com.potatotv.pacc.controller

---
# 本地开发 profile：允许 H2 + 演示默认密钥 + 邮件/飞书 stub，便于无外网联调。
# 启动示例：mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:pacc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  # local 用 H2 内存库，简化建表，无需 Flyway 迁移
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
pacc:
  security:
    admin-api-key: pacc-admin-secret-key
    super-admin-key: pacc-super-admin-secret-key
    jwt-secret: "PACC-v5-runtime-secret-key-change-me-in-production-0123456789"
    wss-sign-secret: "pacc-dev-wss-sign-key-change-me"
    sig-secret: "pacc-sig-test-secret"
  mail:
    stub-enabled: true
    # 本地联调：兜底前缀，避免构造重置链接时落到公网地址
    reset-base-url: http://localhost:5173
  feishu:
    enabled: false
springdoc:
  # 本地联调开启 Swagger / OpenAPI 在线调试
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    com.potatotv.pacc: DEBUG