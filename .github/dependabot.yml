# 依赖自动安全更新
#  - GitHub Actions 自身
#  - Maven (ptv-backend / ptv-client)
#  - npm (ptv-frontend)
#  - Go modules (deploy/gateway-go) / Cargo (deploy/pipe-rust) / pip (deploy/ai)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]

  - package-ecosystem: npm
    directory: /ptv-frontend
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]

  - package-ecosystem: gomod
    directory: /deploy/gateway-go
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    labels: [ "dependencies" ]

  - package-ecosystem: cargo
    directory: /deploy/pipe-rust
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    labels: [ "dependencies" ]

  - package-ecosystem: pip
    directory: /deploy/ai
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    labels: [ "dependencies" ]

  - package-ecosystem: maven
    directory: /ptv-backend
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    ignore:
      # Java 语言版本锁定 21，禁止自动升主版本
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    labels: [ "dependencies" ]

  - package-ecosystem: maven
    directory: /ptv-client
    schedule:
      interval: weekly
      time: "04:00"
      timezone: "Asia/Shanghai"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    labels: [ "dependencies" ]