name: 功能建议
description: 提一个具体的功能或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚要解决什么问题，再说想怎么做。方案写得越具体，越容易直接进 Roadmap。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 现在的做法哪里难受？谁受影响（玩家 / 管理员 / 服务器运营）？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 有接口 / 页面 / 配置项的草案就写出来
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要落在哪一块
      options:
        - ptv-backend（管控后端）
        - ptv-frontend（管理后台 / 下载站）
        - ptv-client / ptv-desktop（玩家端）
        - platform（平台适配层）
        - deploy（编排 / 网关 / 监控）
        - CI 与工具链
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 与三条架构约束的关系
      description: 违反任意一条的方案不会合入，请在这里说明为什么没有违反
      options:
        - label: 不涉及封禁玩家（本系统只做检测、留痕、红屏警告、远程查端）
          required: true
        - label: 不涉及接入游戏服务器 API 或数据库，数据只来自玩家设备本机
          required: true
        - label: 不需要管理后台与游戏服务器合并部署
          required: true