name: Bug 报告
description: 报告一个能稳定复现的缺陷
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        贴日志之前先把密钥、token、玩家真实 PTEID 处理掉。

  - type: input
    id: component
    attributes:
      label: 影响模块
      description: 目录名即可，例如 ptv-backend / ptv-client / ptv-frontend / deploy/gateway-go
      placeholder: ptv-client
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Android
        - iOS / iPadOS
        - HarmonyOS
        - Linux
        - 不涉及端侧
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: 打 tag 之前填 commit 短 sha
      placeholder: 3c72e5e
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      value: |
        1.
        2.
        3.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 报错原文贴这里。CI 上的问题直接给 run 链接。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（已脱敏）
      description: 日志里的 control 字符和查询参数最好也去掉
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: 提交前确认
      options:
        - label: 已去掉密钥、token 和玩家真实身份信息
          required: true
        - label: 已搜过现有 issue，没有重复
          required: true