# PACC CI —— 全模块构建 + 测试 + 安全扫描 + SBOM 制品
# 加固要点：
#   - 最小权限（permissions: contents: read）
#   - 缓存 Maven/npm/Go 加速
#   - gitleaks 密钥泄露扫描 + Trivy 依赖漏洞扫描
#   - 每次提交可取消（concurrency），防积压
name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read   # 最小权限：CI 只读仓库代码

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ---- 密钥泄漏 / 供应链扫描（最前置）----
  secret-scan:
    name: 密钥扫描 (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # 上传 SARIF 到 Code Scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 要扫提交历史，必须全量 clone
      # 用官方二进制，不用 gitleaks-action：本仓库属于组织，action 需要 GITLEAKS_LICENSE，
      # 没配就直接红。二进制不需要 license，sha256 固定后可复现。
      - name: 安装 gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: 扫描提交历史中的密钥
        run: |
          gitleaks git --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif \
            --log-opts="--all"
      # 扫到密钥时上一步会以非 0 退出，报告仍要用 always() 捞出来
      - name: 上传扫描结果
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---- 版本号一致性（A01 门禁）----
  # 以 ptv-backend/pom.xml 的 <version> 为唯一基准，反查全仓库其余 40 余处版本字段。
  # 任何一处没跟上（新增模块漏写、手工改动、合并冲突残留）都会在这里被拦下。
  version-consistency:
    name: 版本号一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 取出基准版本
        id: ver
        run: |
          set -euo pipefail
          V=$(grep -A2 '<artifactId>ptv-backend</artifactId>' ptv-backend/pom.xml \
              | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n1)
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::无法从 ptv-backend/pom.xml 解析出版本号（得到 '$V'）"
            exit 1
          fi
          echo "基准版本：$V"
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: 校验全仓库版本号一致
        run: bash scripts/bump-version.sh "${{ steps.ver.outputs.value }}" --check
      - name: 打 tag 时校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACC_TAG_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$PACC_TAG_VERSION" ]; then
            echo "::error::tag v$TAG 与代码内版本 $PACC_TAG_VERSION 不一致"
            exit 1
          fi

  # ---- 后端 / 玩家端（Java 21 + Maven）----
  java:
    name: Java 模块构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 构建后端 ptv-backend
        working-directory: ptv-backend
        run: mvn -B -q package
      - name: 构建玩家端 ptv-client
        working-directory: ptv-client
        run: mvn -B -q package
      - name: 校验 ptv-client 发行产物已加固
        working-directory: ptv-client
        run: |
          set -euo pipefail
          JAR=$(ls target/ptv-client-*.jar | head -n1)
          echo "检查产物：$JAR"
          # 入口类是唯一对外契约，必须保留
          unzip -l "$JAR" | grep -q 'com/potatotv/paccclient/PaccClient.class' \
            || { echo "::error::产物缺少入口类 PaccClient"; exit 1; }
          # 原始业务包路径必须已被 -repackageclasses 抹平
          if unzip -l "$JAR" | grep -qE 'com/potatotv/paccclient/(detection|transport|signature|store|ops|probe)/'; then
            echo "::error::发行 JAR 未混淆：仍存在原始业务包路径"; exit 1
          fi
          # 必须存在短名混淆类，防止 ProGuard 被误跳过
          unzip -l "$JAR" | grep -qE 'com/potatotv/paccclient/[a-z]{1,3}\.class' \
            || { echo "::error::未发现混淆后的短类名，ProGuard 可能未执行"; exit 1; }
      - name: 生成后端 SBOM (CycloneDX)
        working-directory: ptv-backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        continue-on-error: true
      # 测试失败时报告最需要被看到，所以用 always()：即便上面构建挂了也把报告捞出来
      - name: 上传后端测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            ptv-backend/target/surefire-reports/
            ptv-backend/target/site/jacoco/
          if-no-files-found: ignore
      # PR 页面覆盖率：需在仓库 Secrets 里配 CODECOV_TOKEN（私有仓库必需）。
      # 未配置时该步骤会失败但被 continue-on-error 吞掉，不会把 CI 拖红。
      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ptv-backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: |
            ptv-backend/target/*.jar
            ptv-client/target/*.jar
            ptv-backend/target/bom.xml

  # ---- 前端（Node 20 + Vite）----
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ptv-frontend/package-lock.json
      - name: 安装依赖
        working-directory: ptv-frontend
        run: npm ci
      - name: 运行单元测试
        working-directory: ptv-frontend
        run: npm run test:ci
      - name: 上传前端测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: ptv-frontend/reports/
          if-no-files-found: ignore
      - name: 构建
        working-directory: ptv-frontend
        run: npm run build
      - name: 校验发行产物不含 Source Map
        working-directory: ptv-frontend
        run: |
          set -euo pipefail
          if find dist -name '*.map' | grep -q .; then
            echo "::error::dist 中存在 Source Map，会完整还原前端源码"
            find dist -name '*.map'
            exit 1
          fi
          if grep -rl 'sourceMappingURL' dist; then
            echo "::error::产物中仍引用 sourceMappingURL"
            exit 1
          fi
          # 防止 vite.config.js 覆盖 vite.config.ts 导致加固配置失效
          if [ -f vite.config.js ]; then
            echo "::error::存在 vite.config.js，Vite 会优先读取它并忽略 vite.config.ts"
            exit 1
          fi
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ptv-frontend/dist

  # ---- Go 边缘网关 ----
  go:
    name: Go 网关构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/gateway-go
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: deploy/gateway-go/go.sum
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o gateway-go .
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: gateway-go-bin
          path: deploy/gateway-go/gateway-go

  # ---- Rust 管道 ----
  rust:
    name: Rust 管道构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/pipe-rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pipe-rust-bin
          path: deploy/pipe-rust/target/release/*

  # ---- DF 平台：Rust 统一检测核心 + Linux 原生客户端 + eBPF（A10/A16/A17/A20）----
  # 这一组源码在 Linux runner 上才编得动，Windows 开发机只做静态检查。
  # 各步骤对「目录/文件还不存在」保持容忍：分支裁剪或尚未落地的部分直接跳过而不是报红，
  # 但只要源码在，就必须真的编过、测过。
  df-platform:
    name: DF 平台构建 (Rust/eBPF/Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 探测源码是否存在
        id: probe
        run: |
          set -euo pipefail
          has() { [ -e "$1" ] && echo yes || echo no; }
          echo "rust_core=$(has platform/rust-core/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "linux_client=$(has platform/linux-client/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(has platform/kernel-linux/Makefile)" >> "$GITHUB_OUTPUT"

      - name: 安装 Rust 工具链
        if: steps.probe.outputs.rust_core == 'yes' || steps.probe.outputs.linux_client == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: 缓存 cargo
        if: steps.probe.outputs.rust_core == 'yes' || steps.probe.outputs.linux_client == 'yes'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            platform/rust-core
            platform/linux-client

      # A20：Rust 核心五平台抽象必须可编译
      - name: 构建 Rust 统一检测核心
        if: steps.probe.outputs.rust_core == 'yes'
        working-directory: platform/rust-core
        run: |
          set -euo pipefail
          cargo build --workspace --release
          cargo test --workspace
      - name: Rust 格式与 lint
        if: steps.probe.outputs.rust_core == 'yes'
        working-directory: platform/rust-core
        run: |
          cargo fmt --all -- --check
          # linker_messages 放进白名单：cdylib 在 Windows 上链接时工具链会打印
          # 「正在创建库 xxx.dll.lib」，这是链接器噪声不是代码问题，
          # 否则 -D warnings 会因为跑在哪个平台而红。
          cargo clippy --workspace --all-targets -- -D warnings -A linker_messages
      - name: 上传 Rust 核心产物
        if: steps.probe.outputs.rust_core == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-libs
          path: platform/rust-core/target/release/*.so
          if-no-files-found: ignore

      # A16 / A17：Linux 原生客户端要能出安装包
      - name: 构建 Linux 原生客户端
        if: steps.probe.outputs.linux_client == 'yes'
        working-directory: platform/linux-client
        run: |
          set -euo pipefail
          cargo build --release
          cargo test --release
      - name: 打包 Linux 原生客户端
        if: steps.probe.outputs.linux_client == 'yes'
        working-directory: platform/linux-client
        run: |
          set -euo pipefail
          if [ -x ./package.sh ]; then
            ./package.sh
            ls -l target/dist/
          else
            echo "::warning::platform/linux-client/package.sh 不存在，跳过打包"
          fi
      - name: 上传 Linux 客户端安装包
        if: steps.probe.outputs.linux_client == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: linux-client-packages
          path: platform/linux-client/target/dist/*
          if-no-files-found: warn

      # A10 / A11：eBPF 程序需要 clang + libbpf + 与内核匹配的 BTF，环境面比 Rust 宽，
      # 因此在工具链跑通前先不阻断流水线（见 kernel-linux/README）。
      - name: 安装 eBPF 工具链
        if: steps.probe.outputs.ebpf == 'yes'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev bpftool linux-tools-common
      - name: 构建 eBPF 程序
        if: steps.probe.outputs.ebpf == 'yes'
        working-directory: platform/kernel-linux
        run: |
          set -euo pipefail
          if [ ! -f /sys/kernel/btf/vmlinux ]; then
            echo "::warning::runner 内核无 BTF（/sys/kernel/btf/vmlinux 缺失），跳过 eBPF 编译"
            exit 0
          fi
          make
      - name: 上传 eBPF 目标文件
        if: steps.probe.outputs.ebpf == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-objects
          path: platform/kernel-linux/*.o
          if-no-files-found: ignore

  # ---- Python AI 服务 ----
  python:
    name: AI 服务校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/ai
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .

  # ---- 依赖漏洞扫描（聚合已构建产物源码）----
  vuln-scan:
    name: 依赖漏洞扫描 (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 上传 SARIF 到 Code Scanning 需该权限
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy 文件系统扫描
        # v0.36.0；注意标签带 v 前缀，写 0.36.0 会解析不到，job 会死在 Set up job
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: ptv-backend
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true
      - name: 上传扫描结果
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif