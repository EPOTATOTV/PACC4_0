# PACC CI —— 全模块构建 + 测试 + 安全扫描 + SBOM 制品
# 加固要点：
#   - 最小权限（permissions: contents: read）
#   - 缓存 Maven/npm/Go 加速
#   - gitleaks 密钥泄露扫描 + Trivy 依赖漏洞扫描
#   - 每次提交可取消（concurrency），防积压
name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read   # 最小权限：CI 只读仓库代码

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ---- 密钥泄漏 / 供应链扫描（最前置）----
  secret-scan:
    name: 密钥扫描 (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 按需放开：gitleaks 需将发现的密钥写入 Code Scanning alerts
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 后端 / 玩家端（Java 21 + Maven）----
  java:
    name: Java 模块构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 构建后端 ptv-backend
        working-directory: ptv-backend
        run: mvn -B -q package
      - name: 构建玩家端 ptv-client
        working-directory: ptv-client
        run: mvn -B -q package
      - name: 校验 ptv-client 发行产物已加固
        working-directory: ptv-client
        run: |
          set -euo pipefail
          JAR=$(ls target/ptv-client-*.jar | head -n1)
          echo "检查产物：$JAR"
          # 入口类是唯一对外契约，必须保留
          unzip -l "$JAR" | grep -q 'com/potatotv/paccclient/PaccClient.class' \
            || { echo "::error::产物缺少入口类 PaccClient"; exit 1; }
          # 原始业务包路径必须已被 -repackageclasses 抹平
          if unzip -l "$JAR" | grep -qE 'com/potatotv/paccclient/(detection|transport|signature|store|ops|probe)/'; then
            echo "::error::发行 JAR 未混淆：仍存在原始业务包路径"; exit 1
          fi
          # 必须存在短名混淆类，防止 ProGuard 被误跳过
          unzip -l "$JAR" | grep -qE 'com/potatotv/paccclient/[a-z]{1,3}\.class' \
            || { echo "::error::未发现混淆后的短类名，ProGuard 可能未执行"; exit 1; }
      - name: 生成后端 SBOM (CycloneDX)
        working-directory: ptv-backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
        continue-on-error: true
      # 测试失败时报告最需要被看到，所以用 always()：即便上面构建挂了也把报告捞出来
      - name: 上传后端测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            ptv-backend/target/surefire-reports/
            ptv-backend/target/site/jacoco/
          if-no-files-found: ignore
      # PR 页面覆盖率：需在仓库 Secrets 里配 CODECOV_TOKEN（私有仓库必需）。
      # 未配置时该步骤会失败但被 continue-on-error 吞掉，不会把 CI 拖红。
      - name: 上传覆盖率到 Codecov
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ptv-backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: |
            ptv-backend/target/*.jar
            ptv-client/target/*.jar
            ptv-backend/target/bom.xml

  # ---- 前端（Node 20 + Vite）----
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ptv-frontend/package-lock.json
      - name: 安装依赖
        working-directory: ptv-frontend
        run: npm ci
      - name: 运行单元测试
        working-directory: ptv-frontend
        run: npm run test:ci
      - name: 上传前端测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: ptv-frontend/reports/
          if-no-files-found: ignore
      - name: 构建
        working-directory: ptv-frontend
        run: npm run build
      - name: 校验发行产物不含 Source Map
        working-directory: ptv-frontend
        run: |
          set -euo pipefail
          if find dist -name '*.map' | grep -q .; then
            echo "::error::dist 中存在 Source Map，会完整还原前端源码"
            find dist -name '*.map'
            exit 1
          fi
          if grep -rl 'sourceMappingURL' dist; then
            echo "::error::产物中仍引用 sourceMappingURL"
            exit 1
          fi
          # 防止 vite.config.js 覆盖 vite.config.ts 导致加固配置失效
          if [ -f vite.config.js ]; then
            echo "::error::存在 vite.config.js，Vite 会优先读取它并忽略 vite.config.ts"
            exit 1
          fi
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ptv-frontend/dist

  # ---- Go 边缘网关 ----
  go:
    name: Go 网关构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/gateway-go
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: deploy/gateway-go/go.sum
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o gateway-go .
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: gateway-go-bin
          path: deploy/gateway-go/gateway-go

  # ---- Rust 管道 ----
  rust:
    name: Rust 管道构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/pipe-rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pipe-rust-bin
          path: deploy/pipe-rust/target/release/*

  # ---- Python AI 服务 ----
  python:
    name: AI 服务校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/ai
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .

  # ---- 依赖漏洞扫描（聚合已构建产物源码）----
  vuln-scan:
    name: 依赖漏洞扫描 (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 上传 SARIF 到 Code Scanning 需该权限
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ptv-backend
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true
      - name: 上传扫描结果
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif