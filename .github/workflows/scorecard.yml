# OpenSSF Scorecard —— 仓库自身的安全姿态评分
#
# CodeQL 看代码，Trivy 看依赖，这个看「仓库怎么被管理的」：分支保护、审查要求、
# action 是否 pin、令牌权限、发布是否签名。结果会出现在 Security 面板的 Code Scanning 里。
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '20 3 * * 1'   # 每周一 11:20（北京时间）
  push:
    branches: [ master ]

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # 上传 SARIF
      id-token: write          # publish_results 走 OIDC，结果会进公开的 Scorecard 数据集
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 运行 Scorecard
        # v2.4.4
        #
        # 不阻断流水线：Scorecard 是仓库治理姿态的评分（分支保护、action 是否 pin、
        # 令牌权限……），不是本仓库代码的测试。私库上它会以
        # 「ListCommits: githubv4.Query: Resource not accessible by integration」
        # 失败 —— 那一步是 action 内部拿默认 GITHUB_TOKEN 走 GraphQL 列提交，
        # 权限面不归 workflow 文件管；publish_results 本身也只在公开仓库生效。
        # 扫描成功时照常产出 SARIF，失败时只留一条红步，不影响其它 job 的结论。
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: 上传到 Code Scanning
        # 扫描失败时没有 results.sarif，这里跟着失败没有意义（同上，不阻断）
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard