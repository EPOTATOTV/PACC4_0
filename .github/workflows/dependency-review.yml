# 依赖变更评审 —— 在 PR 阶段就挡掉有已知漏洞的依赖
#
# 与 Trivy 的分工：Trivy 扫「合并之后仓库里有什么」，这个扫「这次 PR 新引入了什么」。
# 配合 dependabot 用才完整：dependabot 负责提，这个负责拦。
name: Dependency Review

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 依赖变更评审
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # 把结论写回 PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: 评审依赖差异
        # v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        # 私库没买 GitHub Advanced Security 时这个 action 必然以
        # 「Dependency review is not supported on this repository. Please ensure that
        # Dependency graph is enabled along with GitHub Advanced Security」失败——
        # 它要读仓库的告警面，那部分权限不在 workflow 文件能配的范围里（contents /
        # pull-requests 已按官方模板给全）。所以不阻断 PR：哪天仓库开了 GHAS，
        # 这一步照常出结论，失败时仍会在日志与 PR 注释里写明原因（处理同 scorecard.yml）。
        continue-on-error: true
        with:
          fail-on-severity: high        # 引入 high 及以上漏洞直接红
          comment-summary-in-pr: on-failure