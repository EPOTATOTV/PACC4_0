# PACC 玩家端用户态服务配置（生产默认：PotatoTV 云端）
# ------------------------------------------------------------------
# 优先级：环境变量 PACC_CLIENT_*  >  应用目录 pacc-client.properties  >  内置默认值
# 生产启用 HTTPS 后，请将 server.uri 与 wss.uri 改为 https:// / wss://
#   （或直接设置环境变量 PACC_CLIENT_SERVER_URI / PACC_CLIENT_WSS_URI）
# ------------------------------------------------------------------

# PTEID 与演示登录账号（DataSeeder 预置：demo@ptv.dev / DemoPass123）
pacc.client.pteid=PT0000000001
# 登录 PTV 后获得的访问令牌（演示固定值；启用自动登录后将被真实 JWT 覆盖）
pacc.client.token=demo-access-token

# PTV 服务器 HTTP 基地址（用于 /api/auth/login 换取真实 JWT）
# 生产（TLS 就绪后）：https://api.potatotv.asia
pacc.client.server.uri=http://api.potatotv.asia

# 演示登录账号（与后端 DataSeeder 预置数据一致）
pacc.client.identity=demo@ptv.dev
pacc.client.password=DemoPass123
pacc.client.remember=false

# 是否启用演示自动登录（生产置 false，改为从本地安全存储注入令牌）
pacc.client.demo.login=true
pacc.client.edition=JAVA

# PTV 服务器 WebSocket 端点（TLS 1.3 / WSS）
# 生产（TLS 就绪后）：wss://pacc.potatotv.asia/ws/ptv
pacc.client.wss.uri=ws://pacc.potatotv.asia/ws/ptv

# 心跳间隔（秒）
pacc.client.heartbeat.seconds=15
# 端侧预评分（演示：随机 0-100；生产由检测引擎真实计算）
pacc.client.client.risk=58
# 是否启用演示模式（周期性上报模拟检测事件）
pacc.client.demo=true

# 断线自动重连：间隔（秒）与开关
pacc.client.reconnect.delay.seconds=5
pacc.client.reconnect.enabled=true

# 端侧签名库版本
pacc.client.signature.version=v5.4.0

# 签名密钥（必填，无内置默认值，缺失时客户端拒绝启动）
#   pacc.client.wss.sign.secret  WSS 上报签名密钥，须与后端 PACC_SECURITY_WSS_SIGN_SECRET 一致
#   pacc.client.signature.secret 特征库热更新包签名密钥，须与后端 PACC_SIG_SECRET 一致
# 生产建议用环境变量注入：PACC_CLIENT_WSS_SECRET / PACC_CLIENT_SIG_SECRET

# ---- 跨平台更新（PCU，设计文档第四章）----
# 关闭后台更新检查（不下载、不检查，也不影响检测链路）
pacc.client.update.enabled=true
# 更新服务基址：检查更新 /v1/update/check 与制品下载都从这里出
pacc.client.update.base.uri=https://api.potatotv.asia
# 更新通道：stable / beta / alpha / dev
pacc.client.update.channel=stable
# 更新包 RSA-2048 签名公钥（Base64 X.509）。留空 = 只校验 SHA-256，不校验签名；
# 生产必须填，否则拿到 download_url 的人可以换成任意同版本包。
pacc.client.update.public.key=
# 制品下载主机白名单（逗号分隔）。留空 = 只允许 pacc.potatotv.asia、dl.potatotv.asia
# 与上面 base.uri 的主机；制品放在这些域之外时要在这里补上，否则端侧会拒绝清单里的下载地址。
pacc.client.update.download.hosts=
