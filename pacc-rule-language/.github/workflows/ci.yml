name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译并跑单测
        run: mvn -B -ntp verify

  zero-dependencies:
    name: 校验运行时零第三方依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 判据：pom.xml 里除 test 作用域的 JUnit 之外，不得出现任何 dependency。
      # maven-enforcer-plugin 已经在 validate 阶段拦 compile/runtime 依赖，这里再独立查一遍，
      # 是为了在「有人手改 pom 并顺手关掉 enforcer」时也能发现。
      - name: 检查 pom.xml
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          pom = pathlib.Path("pom.xml").read_text(encoding="utf-8")
          blocks = re.findall(r"<dependency>.*?</dependency>", pom, re.S)
          offending = []
          for block in blocks:
              artifact = re.search(r"<artifactId>\s*([^<\s]+)", block)
              scope = re.search(r"<scope>\s*([^<\s]+)", block)
              name = artifact.group(1) if artifact else "<未知>"
              if name == "junit-jupiter" and scope and scope.group(1) == "test":
                  continue
              offending.append(name)

          if offending:
              print("发现非 test 作用域的依赖：" + ", ".join(offending))
              sys.exit(1)
          print(f"通过：{len(blocks)} 个依赖，均为 test 作用域的 junit-jupiter")
          PY