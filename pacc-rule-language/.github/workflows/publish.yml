name: Publish

# 打 v* tag 时把 PRL 发布到公共仓库：Java 走 Maven Central，管理端组件包走 npm。
# 凭据全部从 secrets 注入，pom / package.json 里不落盘任何密钥。
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish-java:
    name: 发布到 Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # setup-java 这里要的是「存放 passphrase 的环境变量名」，下面的 deploy 步骤再把它填上
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # -P release 才会启用签名 / source / javadoc / nexus-staging 插件
      - name: 部署到 OSSRH staging 并自动 release
        run: mvn -B -ntp deploy -P release
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-npm:
    name: 发布到 npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prl-editor
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: prl-editor/package-lock.json

      # build 产出 dist（库产物 + 类型声明），package.json 的 files/exports 指向 dist
      - name: 安装依赖并构建
        run: npm ci && npm run build

      - name: 发布到 npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}