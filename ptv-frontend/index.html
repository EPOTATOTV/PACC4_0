<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>PACC PTV 管控后台</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --red: #ff3b30;
        --red-2: #ff6b5e;
        --green: #3fb950;
        --amber: #d29922;
        --blue: #58a6ff;
      }
      * { box-sizing: border-box; }
      @font-face {
        font-family: 'Russo One';
        src: url('/fonts/RussoOne.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      .brand-font {
        font-family: 'Russo One', 'SimHei', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      body {
        margin: 0;
        font-family: 'SimHei', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a { color: var(--blue); text-decoration: none; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
