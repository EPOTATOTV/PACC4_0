<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050608" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PACC PTV 管控后台</title>
    <style>
      :root {
        --bg: #050608;
        --bg-wash: #0a0d12;
        --panel: #101319;
        --panel-2: #161a22;
        --panel-3: #1c212c;
        --border: rgba(255, 255, 255, .08);
        --border-strong: rgba(255, 255, 255, .16);
        --text: #eef0f4;
        --muted: #98a0ae;
        --dim: #626b7a;
        --red: #ff3b30;
        --red-2: #ff6b5e;
        --red-soft: rgba(255, 77, 61, .10);
        --green: #3fb950;
        --amber: #e3a437;
        --blue: #5da9ff;
        --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      /* 顶栏/侧栏的半透明玻璃底：随主题切换（浅色下换成白色半透明，保证可读性） */
      :root { --glass-bar: rgba(5, 6, 8, .55); }
      /* ———— 浅色主题变量覆盖：切换由 <html data-theme> 驱动，配合 antd lightAlgorithm ———— */
      html[data-theme='light'] {
        --bg: #eceef4;
        --bg-wash: #e2e6ee;
        --panel: #ffffff;
        --panel-2: #f6f8fb;
        --panel-3: #eef1f6;
        --border: rgba(15, 23, 42, .10);
        --border-strong: rgba(15, 23, 42, .20);
        --text: #101828;
        --muted: #4f5a70;
        --dim: #8a93a6;
        --red: #d6342a;
        --red-2: #ff5a50;
        --red-soft: rgba(214, 52, 42, .10);
        --green: #1d9e48;
        --amber: #b97a13;
        --blue: #1f6bdb;
        --kpi-green: #1d9e48;
        --kpi-blue: #0d6efd;
        --kpi-red: #d6342a;
        --kpi-amber: #b97a13;
        --kpi-muted: #8a93a6;
        --glass-bar: rgba(255, 255, 255, .72);
      }
      /* 玻璃底光斑在浅色下整体压淡，避免过艳 */
      html[data-theme='light'] .pacc-backdrop-a { opacity: .55; filter: saturate(120%); }
      html[data-theme='light'] .pacc-backdrop-b { opacity: .6; }
      * { box-sizing: border-box; }
      @font-face {
        font-family: 'Russo One';
        src: url('/fonts/RussoOne.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      .brand-font {
        font-family: 'Russo One', 'SimHei', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: 'SimHei', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.66;
      }
      /* ———— 排版层级强烈区分（去 AI：禁止全站统一行高/统一灰/统一字距）————
         大标题紧凑厚重、正文舒展、小字辅助更紧；标题加宽、正文与小字不加宽。 */
      :root {
        --lh-title: 1.14;
        --lh-body: 1.66;
        --lh-small: 1.32;
        --ls-title: .02em;
      }
      h1, h2, h3, h4, h5, h6, .ant-typography-heading {
        line-height: var(--lh-title);
        letter-spacing: var(--ls-title);
        font-weight: 700;
      }
      p, .ant-typography { line-height: var(--lh-body); }
      /* 弱化文本优先用透明度，少用灰（避免全是 #9aa 灰味） */
      .ant-typography-secondary, .ant-form-item-label, .section-title {
        color: var(--text) !important;
        opacity: .7;
      }
      /* 全局极低透明度噪点：消除 AI 干净塑料感（不挡交互，浅色下更淡） */
      body::after {
        content: ''; position: fixed; inset: 0; z-index: 9997; pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1px);
        background-size: 3px 3px; opacity: .055; mix-blend-mode: overlay;
      }
      html[data-theme='light'] body::after { opacity: .04; }
      ::selection { background: rgba(255, 77, 61, .30); }
      a { color: var(--blue); text-decoration: none; }
      /* 数字/代码统一用 JetBrains Mono，界面统计更有质感 */
      .mono { font-family: var(--mono); font-variant-ligatures: none; }
      /* antd 深色表格表头、滚动条深色化 */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }

      /* ———— P1 样式打磨：语义 KPI 色 / 等宽统计 / 焦点环 / KPI 卡 / 克制动效 ———— */
      :root {
        --kpi-green: #3fb950;
        --kpi-blue: #58a6ff;
        --kpi-red: #ff3b30;
        --kpi-amber: #d29922;
        --kpi-muted: #8b949e;
      }
      /* —— 液态玻璃三层结构（禁止单层敷衍玻璃）——
         1) 基底：半透明底（inline）+ backdrop 模糊/饱和，让背后光斑透入
         2) 光影：顶部高光细描边、底部更暗、内侧微弱折射柔光、整体投深远影（inset box-shadow）
         3) 高光层：左上内弧折射光晕（::before 径向），模拟液滴厚度与曲面折射 */
      .pacc-glass {
        -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
        backdrop-filter: blur(28px) saturate(200%) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .22),
          inset 0 -1px 0 rgba(255, 255, 255, .05),
          inset 2px 0 12px rgba(255, 255, 255, .05),
          inset -2px 0 12px rgba(255, 255, 255, .02),
          inset 0 0 46px rgba(255, 255, 255, .045),
          0 44px 100px rgba(0, 0, 0, .48) !important;
        position: relative;
      }
      .pacc-glass::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(120% 72% at 14% 0%, rgba(255, 255, 255, .13), transparent 52%);
      }
      /* —— 卡片分级差异化（去 AI：大板块/中面板/小组件的圆角、投影、内距分级，
            严禁全站同一个圆角/同一套阴影；内距用非 4px 整数，跨组件故意不统一） —— */
      .pacc-glass { border-radius: 18px; }
      .pacc-glass-lg { border-radius: 24px; }  /* 页级大板块：更圆、投影更深更散 */
      .pacc-glass-md { border-radius: 14px; }  /* 中点面板：数据卡/表单容器 */
      .pacc-glass-sm { border-radius: 9px; }   /* 小组件/KPI/内嵌标签：小圆、克制动效 */
      /* antd 默认卡原样太统一，按层级做差异化：顶层面板 > 表格内嵌 > KPI 小件 */
      .ant-card { border-radius: 15px; }
      .ant-card .ant-card { border-radius: 11px; box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
      .ant-card.metric-card { border-radius: 10px; }
      /* 统计数字统一等宽，强化运营台质感 */
      .ant-statistic-content { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .ant-statistic-title { letter-spacing: .02em; color: var(--muted); }
      /* 可聚焦控件焦点环 */
      :focus-visible { outline: 2px solid rgba(255, 107, 94, .6); outline-offset: 1px; }
      .ant-input:focus-visible, .ant-input-affix-wrapper:focus-within, .ant-btn:focus-visible {
        outline: 2px solid rgba(255, 107, 94, .5); outline-offset: 1px;
      }
      /* KPI 卡：hover 仅提亮边框与加深阴影，不位移、不放大、不做大渐变 */
      .ant-card.metric-card { transition: border-color .18s ease, box-shadow .18s ease; }
      .ant-card.metric-card:hover { border-color: var(--border-strong); box-shadow: 0 6px 22px rgba(0, 0, 0, .32); }
      /* 文字分割线分区块 / 分隔线（非卡片分区，支持克制布局） */
      .section-title {
        display: flex; align-items: center; gap: 10px;
        font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--muted); margin: 22px 0 10px;
      }
      .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
      .secret-line { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
      /* 入场动效：分「快·小控件」与「阻尼·大面板」两种节奏，杜绝全站同速 */
      @keyframes paccFadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes paccRise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: none; }
      }
      .pacc-in { animation: paccFadeUp .26s cubic-bezier(.3, .7, .35, 1) both; }
      /* 大面板入场：阻尼慢、位移大（>180ms、灵动又克制） */
      .pacc-in-slow { animation: paccRise .8s cubic-bezier(.22, 1, .36, 1) both; }

      /* —— 背景流动：长周期 22s 超慢、柔和宏大，且视差分层 ——
         背景层移动最大（paccDrift / ~24s）、玻璃层其次（paccDriftB / ~32s）、
         文字完全不参与变换 = 明确的「背景 > 玻璃 > 文字」纵深。禁用闪烁/频闪。 */
      @keyframes paccDrift {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        33%  { transform: translate3d(52px, 40px, 0) scale(1.12); }
        66%  { transform: translate3d(-28px, 34px, 0) scale(1.06); }
        100% { transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes paccDriftB {
        0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
        50%  { transform: translate3d(-30px, -20px, 0) rotate(3deg); }
        100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      }
      .pacc-aurora { animation: paccDrift 24s cubic-bezier(.45, 0, .55, 1) infinite; will-change: transform; }

      /* ———— 全站液态玻璃底光斑层 ————
         色彩克制：主色唯一（深红）+ 单个辅助（深蓝），降饱和、加深空深邃；
         避免五颜六色高饱和堆砌。背景透明、不遮字。穿透布局（Layout z-index:1）。 */
      .pacc-backdrop-a,
      .pacc-backdrop-b {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      }
      .pacc-backdrop-a {
        background:
          radial-gradient(56vw 52vh at 16% 10%, rgba(255, 77, 61, .26), transparent 64%),
          radial-gradient(44vw 40vh at 86% 30%, rgba(56, 96, 180, .22), transparent 64%),
          radial-gradient(38vw 36vh at 60% 96%, rgba(30, 40, 60, .55), transparent 66%),
          radial-gradient(30vw 28vh at 8% 88%, rgba(58, 78, 120, .16), transparent 62%);
        animation: paccDrift 24s cubic-bezier(.45, 0, .55, 1) infinite;
        will-change: transform;
      }
      .pacc-backdrop-b {
        background:
          radial-gradient(30vw 32vh at 64% 34%, rgba(200, 216, 255, .10), transparent 64%),
          radial-gradient(26vw 28vh at 26% 70%, rgba(255, 107, 94, .08), transparent 64%);
        animation: paccDriftB 32s cubic-bezier(.45, 0, .55, 1) infinite;
        will-change: transform;
      }

      /* ———— P2 精致微动效（参考 uiverse.io 取向，简单但处处精致）————
         原则：位移 ≤2px、时长 ≤180ms、只改 border/background/shadow/transform，
         全程尊重系统「减弱动态」。不缩放、不旋转、不做无意义循环。 */
      :root {
        --motion-fast: 140ms cubic-bezier(.4, 0, .2, 1);
        --motion-base: 200ms cubic-bezier(.4, 0, .2, 1);
      }

      /* 按钮：hover 微上浮 + 边框辉光；active 轻按压回弹 */
      .ant-btn {
        transition: transform var(--motion-fast), border-color var(--motion-fast),
          box-shadow var(--motion-fast), background var(--motion-fast), color var(--motion-fast);
      }
      .ant-btn:not(:disabled):hover { transform: translateY(-1px); }
      .ant-btn:not(:disabled):active { transform: translateY(0) scale(.98); }
      .ant-btn-primary:not(:disabled):hover {
        box-shadow: 0 4px 16px rgba(255, 77, 61, .28);
      }

      /* 菜单项：hover 左缘指示条渐现 + 底色过渡，选中态柔和渐变 */
      .ant-menu-item { transition: background var(--motion-base), color var(--motion-base); }
      .ant-menu-inline .ant-menu-item::before {
        content: '';
        position: absolute; insetInlineStart: 0; insetBlock: 22%;
        width: 2px; border-radius: 2px;
        background: var(--red-2);
        transform: scaleY(0); opacity: 0;
        transition: transform var(--motion-base), opacity var(--motion-base);
      }
      .ant-menu-inline .ant-menu-item:hover::before,
      .ant-menu-inline .ant-menu-item-selected::before {
        transform: scaleY(1); opacity: 1;
      }

      /* 表格行：hover 高亮衔接（只用背景，不用位移） */
      .ant-table-tbody > tr { transition: background var(--motion-base); }

      /* MetricCard：hover 上浮 1px + 语义条左缘延伸发光，契合下发丝基调 */
      .ant-card.metric-card { transition: transform var(--motion-base), border-color var(--motion-base), box-shadow var(--motion-base); }
      .ant-card.metric-card:hover { transform: translateY(-1px); }
      .ant-card.metric-card > .ant-card-body > span { transition: box-shadow var(--motion-base); }
      .ant-card.metric-card:hover > .ant-card-body > span { box-shadow: 0 0 12px rgba(255, 77, 61, .35); }

      /* 开关与标签：过渡柔和 */
      .ant-switch { transition: background var(--motion-base), opacity var(--motion-fast); }
      .ant-tag { transition: background var(--motion-fast), color var(--motion-fast), border-color var(--motion-fast); }

      /* 卡片 hover：仅背景微提，禁止位移（避免“满屏跳动”），边框更亮 */
      .ant-card:not(.metric-card) { transition: border-color var(--motion-base), background var(--motion-base); }
      .ant-card:not(.metric-card):hover { border-color: var(--border-strong); }

      /* 入场 stagger：用于 Row 内多个子项顺序浮现，动画简单但序列精致 */
      .pacc-stagger > * { opacity: 0; animation: paccFadeUp .28s ease both; }
      .pacc-stagger > *:nth-child(1) { animation-delay: 0ms; }
      .pacc-stagger > *:nth-child(2) { animation-delay: 40ms; }
      .pacc-stagger > *:nth-child(3) { animation-delay: 80ms; }
      .pacc-stagger > *:nth-child(4) { animation-delay: 120ms; }
      .pacc-stagger > *:nth-child(n+5) { animation-delay: 160ms; }

      /* ———— P3：表格 / 控件的精致化覆盖（作用于全站所有 antd 表格页）————
         消除 antd 默认观感的「AI 味」：表头发丝底、行分隔线、等宽数字、状态标签、
         分段控件、标签页、分页器、空态。克制动效，尊重减弱动态。 */
      /* 卡片内嵌表格：去掉卡片底色干扰，表头更透气 */
      .ant-card .ant-table { background: transparent; }
      .ant-card .ant-table-container,
      .ant-card .ant-table-content { border-inline-start: 0 !important; }
      /* 表头：发丝底部 + 深一档底色 + 小字距 */
      .ant-table-thead > tr > th {
        background: rgba(255, 255, 255, .02) !important;
        color: var(--muted) !important;
        font-weight: 500 !important;
        font-size: 12px !important;
        letter-spacing: .02em;
        border-bottom: 1px solid var(--border) !important;
        padding-block: 10px !important;
      }
      /* 表格行：垂直居中 + 行间发丝 + hover 柔和提亮 */
      .ant-table-tbody > tr > td {
        padding-block: 11px !important;
        border-bottom: 1px solid var(--border) !important;
      }
      .ant-table-tbody > tr:hover > td { background: rgba(255, 255, 255, .025) !important; }
      .ant-table-cell-fix-left, .ant-table-cell-fix-right { background: var(--panel); }
      /* 等宽数字列强化运营感（已含 tabular-nums，这里统一未设 type 的数字列） */
      .ant-table-tbody .ant-typography { font-variant-numeric: tabular-nums; }

      /* 分段控件：玻璃面板 + 选中项红点标识 */
      .ant-segmented {
        background: rgba(255, 255, 255, .03) !important;
        border: 1px solid var(--border) !important;
        padding: 3px !important;
      }
      .ant-segmented-item { transition: background var(--motion-fast), color var(--motion-fast); }
      .ant-segmented-item-selected {
        background: rgba(255, 77, 61, .14) !important;
        color: var(--red-2) !important;
        box-shadow: none !important;
      }

      /* 标签页：底部发丝 + 选中项语义色 */
      .ant-tabs-nav::before { border-bottom-color: var(--border) !important; }
      .ant-tabs-tab { transition: color var(--motion-fast); }
      .ant-tabs-tab:hover { color: var(--text) !important; }

      /* 标签：发丝描边取代实心块，降低噪点 */
      .ant-tag { border-width: 1px !important; background: transparent !important; border-radius: 5px; }

      /* 分页器：当前页用语义红，禁用态更淡 */
      .ant-pagination .ant-pagination-item {
        background: transparent !important; border-color: var(--border) !important;
      }
      .ant-pagination .ant-pagination-item-active {
        border-color: var(--red) !important; background: rgba(255, 77, 61, .14) !important;
      }
      .ant-pagination .ant-pagination-item-active a { color: var(--red-2) !important; }

      /* 输入/下拉：聚焦发丝红光，替代默认蓝 */
      .ant-input, .ant-input-affix-wrapper, .ant-select-selector {
        border-color: var(--border) !important;
        transition: border-color var(--motion-fast), box-shadow var(--motion-fast) !important;
      }
      .ant-input:hover, .ant-input-affix-wrapper:hover, .ant-select-selector:hover { border-color: var(--border-strong) !important; }
      .ant-input-focused, .ant-input:focus,
      .ant-input-affix-wrapper-focused .ant-input-affix-wrapper,
      .ant-select-focused .ant-select-selector {
        border-color: var(--red-2) !important;
        box-shadow: 0 0 0 2px rgba(255, 77, 61, .12) !important;
      }

      /* 空态：文案更淡但保留图标 */
      .ant-empty-description { color: var(--dim) !important; }

      /* ———— P4：弹层 / 高阶控件的精致化覆盖 ———— */
      /* Modal / Drawer：深底 + 细边框 + 发丝分隔，去默认圆角感 */
      .ant-modal-content, .ant-drawer-content {
        background: var(--panel) !important;
        border: 1px solid var(--border-strong);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
      }
      .ant-modal-header, .ant-drawer-header { background: transparent !important; border-bottom: 1px solid var(--border) !important; }
      .ant-modal-footer { border-top: 1px solid var(--border) !important; padding-top: 12px; }
      .ant-modal-title, .ant-drawer-title { color: var(--text) !important; letter-spacing: .02em; }
      .ant-modal-close, .ant-drawer-close { color: var(--muted) !important; }
      .ant-modal-close:hover, .ant-drawer-close:hover { color: var(--text) !important; }

      /* 徽标：发丝描边，降低实心噪点 */
      .ant-badge-count { box-shadow: none !important; background: rgba(255, 77, 61, .9) !important; }

      /* 气泡确认 / 提示：深底 + 细边框 */
      .ant-popover-inner, .ant-message-notice-content, .ant-tooltip-inner {
        background: var(--panel-2) !important;
        border: 1px solid var(--border-strong);
        box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
      }

      /* 描述列表：发丝分隔，标签更淡 */
      .ant-descriptions-item-label { color: var(--muted) !important; }
      .ant-descriptions-bordered.ant-descriptions { background: transparent !important; }
      .ant-descriptions-bordered .ant-descriptions-item-label,
      .ant-descriptions-bordered .ant-descriptions-item-content {
        border-color: var(--border) !important;
      }

      /* 表单：表单项间距柔和，label 更清晰 */
      .ant-form-item-label > label { color: var(--muted) !important; letter-spacing: .02em; }

      /* —— LiquidGlassCard：玻璃视觉层与动画层解耦 ——
         .pacc-glass 的 box-shadow/backdrop-filter 带 !important，GSAP 内联样式无法覆盖，
         所以悬停的「描边光 + 光晕跟随」作用在独立叠加层上，玻璃层只负责折射。 */
      .pacc-lgc {
        position: relative;
        border: 1px solid var(--border);
        transition: border-color var(--motion-base);
      }
      .pacc-lgc:hover { border-color: rgba(255, 77, 61, .42); }
      .pacc-lgc-glass {
        position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      }
      .pacc-lgc-halo {
        position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
        border: 1px solid rgba(255, 77, 61, .45); opacity: 0;
      }
      .pacc-lgc-glow {
        position: absolute; left: 50%; top: 50%; width: 260px; height: 260px;
        margin: -130px 0 0 -130px; border-radius: 50%;
        pointer-events: none; opacity: 0;
      }
      .pacc-lgc-body { position: relative; z-index: 1; }

      /* —— RippleButton：点击波纹（波纹节点由组件注入，仅动画 transform/opacity）—— */
      .pacc-ripple-btn {
        position: relative; overflow: hidden;
        display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 18px; border-radius: 9px; cursor: pointer;
        font-family: var(--mono); font-size: 12.5px;
        color: var(--text); border: 1px solid var(--border-strong);
        background: rgba(255, 255, 255, .03);
        transition: transform var(--motion-fast), border-color var(--motion-fast),
          background var(--motion-fast), color var(--motion-fast);
      }
      .pacc-ripple-btn:not(:disabled):hover {
        transform: translateY(-1px); border-color: rgba(255, 77, 61, .5);
        color: var(--red-2); background: var(--red-soft);
      }
      .pacc-ripple-btn:not(:disabled):active { transform: translateY(0) scale(.98); }
      .pacc-ripple-btn:disabled { opacity: .5; cursor: not-allowed; }
      .pacc-ripple-btn.is-primary {
        border-color: transparent; color: #160605;
        background: linear-gradient(180deg, var(--red-2), var(--red));
      }
      .pacc-ripple-btn.is-primary:not(:disabled):hover {
        color: #160605; border-color: transparent;
        background: linear-gradient(180deg, #ff8a5a, #ff4d3d);
        box-shadow: 0 4px 16px rgba(255, 77, 61, .28);
      }

      /* —— TopProgressBar：路由切换顶部进度条 ——
         只动画 transform/opacity（合层），不改宽度，避免每帧触发布局。 */
      .pacc-topbar {
        position: fixed; top: 0; left: 0; right: 0; height: 2px;
        z-index: 3000; pointer-events: none;
        transform-origin: 0 50%; transform: scaleX(0); opacity: 0;
        background: linear-gradient(90deg, var(--red), var(--red-2));
        box-shadow: 0 0 10px rgba(255, 77, 61, .45);
      }

      /* —— RedScreenOverlay：红屏警告全屏层 ——
         三层结构：闪烁层（瞬时高亮）、遮罩层（负责从中心扩散，自身会被 scale 到 3 倍，
         故内容必须放在独立的 body 层，避免一起被放大）。 */
      .pacc-rs {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; background: rgba(6, 2, 2, .72);
      }
      .pacc-rs-flash {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(120% 90% at 50% 40%, rgba(255, 236, 232, .92), var(--red) 70%);
      }
      .pacc-rs-mask {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(90% 70% at 50% 42%, rgba(255, 77, 61, .40), transparent 62%),
          linear-gradient(180deg, rgba(120, 12, 8, .96), rgba(52, 4, 3, .98));
      }
      .pacc-rs-body {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        padding: 28px 30px 26px; max-width: 620px; text-align: center;
      }
      .pacc-rs-stamp {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
        color: rgba(255, 255, 255, .72);
      }
      .pacc-rs-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ffd9d4; box-shadow: 0 0 8px rgba(255, 217, 212, .8);
      }
      .pacc-rs-title {
        margin: 0; font-size: 34px; line-height: 1.18; font-weight: 700;
        letter-spacing: .04em; color: #fff;
        text-shadow: 0 2px 24px rgba(120, 0, 0, .55);
        perspective: 600px;
      }
      .pacc-rs-char { display: inline-block; white-space: pre; }
      .pacc-rs-details {
        display: flex; flex-direction: column; gap: 1px;
        width: 100%; border-radius: 9px; overflow: hidden;
        background: rgba(0, 0, 0, .22);
      }
      .pacc-rs-detail {
        display: flex; align-items: baseline; gap: 14px;
        padding: 9px 15px; text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, .07);
      }
      .pacc-rs-detail:last-child { border-bottom: none; }
      .pacc-rs-detail-label { flex: 0 0 96px; font-size: 12px; color: rgba(255, 255, 255, .58); }
      .pacc-rs-detail-value {
        flex: 1; font-family: var(--mono); font-size: 13px; color: #ffe7e4;
        word-break: break-all;
      }
      .pacc-rs-close {
        margin-top: 2px; padding: 10px 24px; border-radius: 9px; cursor: pointer;
        font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em;
        color: #2a0705; border: none;
        background: linear-gradient(180deg, #ffe2dd, #ffb4ab);
        transition: background var(--motion-fast), transform var(--motion-fast);
      }
      .pacc-rs-close:hover { background: linear-gradient(180deg, #fff2ef, #ffc8c1); }
      .pacc-rs-close:active { transform: scale(.985); }
      @media (max-width: 560px) {
        .pacc-rs-title { font-size: 24px; }
        .pacc-rs-body { padding: 22px 18px; gap: 14px; }
        .pacc-rs-detail-label { flex-basis: 76px; }
      }

      /* 尊重系统「减弱动态」：关闭位移/辉光/交错 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .ant-btn:not(:disabled):hover, .ant-card.metric-card:hover { transform: none; }
        .pacc-ripple-btn:not(:disabled):hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
