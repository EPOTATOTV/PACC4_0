# HTTPS 站点（证书就绪后由 entrypoint.sh 自动启用）
# 证书位置：/etc/nginx/certs/{域名}.crt 与 {域名}.key（由 entrypoint.sh 检查）
# 推荐使用 certbot --webroot 方式获取，见 deploy/gateway/certs/README.md

# admin.potatotv.asia (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.potatotv.asia;

    ssl_certificate     /etc/nginx/certs/potatotv.asia.crt;
    ssl_certificate_key /etc/nginx/certs/potatotv.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ptv-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# api.potatotv.asia (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name api.potatotv.asia;

    ssl_certificate     /etc/nginx/certs/potatotv.asia.crt;
    ssl_certificate_key /etc/nginx/certs/potatotv.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# pacc.potatotv.asia (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name pacc.potatotv.asia;

    ssl_certificate     /etc/nginx/certs/potatotv.asia.crt;
    ssl_certificate_key /etc/nginx/certs/potatotv.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/auth/ {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /actuator/health {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

# dl.potatotv.asia (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name dl.potatotv.asia;

    ssl_certificate     /etc/nginx/certs/potatotv.asia.crt;
    ssl_certificate_key /etc/nginx/certs/potatotv.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/dl;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name admin.potatotv.asia api.potatotv.asia pacc.potatotv.asia dl.potatotv.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
