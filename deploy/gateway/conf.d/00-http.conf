# HTTP 站点（默认即用，无需证书）
# 生产建议启用 HTTPS（放置证书后由 entrypoint.sh 自动切换）

# ---------- admin.potatotv.asia : PTV 管理后台 ----------
server {
    listen 80;
    server_name admin.potatotv.asia;

    # ACME 校验（certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 转发到管理后台前端容器（其 nginx 再代理 /api 与 /ws 到后端）
    location / {
        proxy_pass http://ptv-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- api.potatotv.asia : 后端 REST / WSS ----------
server {
    listen 80;
    server_name api.potatotv.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- pacc.potatotv.asia : 玩家端长连接 + 玩家登录/注册 ----------
server {
    listen 80;
    server_name pacc.potatotv.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 玩家端登录 / 注册（换取真实 JWT）
    location /api/auth/ {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 玩家端 PTV 长连接（WSS / WS）
    location /ws/ {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余路径仅允许健康检查，避免泄露管理端点
    location /actuator/health {
        proxy_pass http://ptv-backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

# ---------- dl.potatotv.asia : PACC 下载站 ----------
server {
    listen 80;
    server_name dl.potatotv.asia;

    root /usr/share/nginx/dl;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
