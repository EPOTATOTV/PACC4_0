# PACC v5.0 域名网关主配置
# 站点配置位于 conf.d/，由 entrypoint.sh 根据证书情况决定启用 HTTP/HTTPS。
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host=$host';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket 长连接
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==================== 反爬 / 限流 ====================
    # 客户端真实 IP：网关若正处于边缘，$remote_addr 即是客户端地址；
    # 若前面还有直连层，则取 XFF 最左一项，回退到直连地址。
    map $http_x_forwarded_for $real_client_ip {
        "~^(?<first>[0-9a-fA-F:.]+)" $first;
        default                       $binary_remote_addr;
    }
    # 非浏览器 UA 判定：空 UA 或常见脚本/抓虫客户端
    map $http_user_agent $is_crawler_ua {
        default                       0;
        ""                             1;
        "~*(curl|wget|python|scrapy|okhttp|libwww-perl|HttpClient|Go-http-client|node-fetch|axios|python-requests|bot|spider|crawler|libcurl)" 1;
    }
    # 通用 API 入口限流（按真实 IP）
    limit_req_zone $real_client_ip zone=ptv_api:20m   rate=60r/m;
    # 登录/注册等敏感入口更严格
    limit_req_zone $real_client_ip zone=ptv_login:20m rate=6r/m;
    # 下载站
    limit_req_zone $real_client_ip zone=ptv_dl:10m    rate=60r/m;
    # 单 IP 并发连接上限
    limit_conn_zone $binary_remote_addr zone=ptv_conn:10m;
    # 生成拒绝响应（避免在多个 if 里重复）
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
