apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacc.fullname" . }}-secrets
  labels:
    {{- include "pacc.labels" . | nindent 4 }}
type: Opaque
data:
  admin-api-key: {{ .Values.secrets.adminApiKey | b64enc | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | b64enc | quote }}
  mysql-root: {{ .Values.secrets.mysqlRootPassword | b64enc | quote }}