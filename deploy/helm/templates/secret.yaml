apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacc.fullname" . }}-secrets
  labels:
    {{- include "pacc.labels" . | nindent 4 }}
type: Opaque
data:
  admin-api-key: {{ required "secrets.adminApiKey 为必填（后端 fail-closed 校验，长度需 >= 12）" .Values.secrets.adminApiKey | b64enc | quote }}
  jwt-secret: {{ required "secrets.jwtSecret 为必填（后端 fail-closed 校验，长度需 >= 32）" .Values.secrets.jwtSecret | b64enc | quote }}
  super-admin-key: {{ required "secrets.superAdminKey 为必填（后端 fail-closed 校验，长度需 >= 12）" .Values.secrets.superAdminKey | b64enc | quote }}
  wss-sign-secret: {{ required "secrets.wssSignSecret 为必填（后端 fail-closed 校验，长度需 >= 16）" .Values.secrets.wssSignSecret | b64enc | quote }}
  mysql-password: {{ include "pacc.mysqlAppPassword" . | b64enc | quote }}
  {{- if .Values.mysql.enabled }}
  mysql-root: {{ required "secrets.mysqlRootPassword 为必填（内置 MySQL 需要 root 密码）" .Values.secrets.mysqlRootPassword | b64enc | quote }}
  {{- end }}
  smtp-password: {{ .Values.secrets.smtpPassword | b64enc | quote }}
  feishu-app-secret: {{ .Values.secrets.feishuAppSecret | b64enc | quote }}