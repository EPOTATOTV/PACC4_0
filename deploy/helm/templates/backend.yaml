apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacc.fullname" . }}-backend
  labels:
    app: pacc-backend
    {{- include "pacc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels: { app: pacc-backend }
  template:
    metadata:
      labels: { app: pacc-backend }
    spec:
      {{- if .Values.mysql.enabled }}
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "pacc.fullname" . }}-mysql 3306; do sleep 2; done"]
      {{- end }}
      containers:
        - name: backend
          image: {{ include "pacc.image" (dict "image" .Values.images.backend) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ include "pacc.mysqlUri" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: "pacc"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacc.fullname" . }}-secrets
                  key: mysql-password
            - name: PACC_SECURITY_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacc.fullname" . }}-secrets
                  key: admin-api-key
            - name: PACC_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacc.fullname" . }}-secrets
                  key: jwt-secret
            - name: PACC_SEED
              value: "true"
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacc.fullname" . }}-backend
  labels:
    app: pacc-backend
    {{- include "pacc.labels" . | nindent 4 }}
spec:
  selector: { app: pacc-backend }
  ports:
    - name: http
      port: 8080
      targetPort: http