{{- if .Values.networkPolicy.enabled }}
# 默认拒绝全部入站，再按组件逐条放行（fail-closed）。
# 前提：以 gateway 作为边缘入口（edge）；若关闭 gateway，Ingress Controller 将无法直连后端。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 边缘入口：放行任意来源（上游由 Ingress Controller / LB 管控）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-gateway
spec:
  podSelector:
    matchLabels: { app: pacc-gateway }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
{{- if .Values.gatewayGo.enabled }}
---
# Go 网关作为可替换入口，同样放行任意来源。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-gateway-go
spec:
  podSelector:
    matchLabels: { app: pacc-gateway-go }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
---
# 后端：仅接受网关 / 前端访问 8080。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-backend
spec:
  podSelector:
    matchLabels: { app: pacc-backend }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: pacc-frontend } }
        - podSelector: { matchLabels: { app: pacc-gateway } }
        - podSelector: { matchLabels: { app: pacc-gateway-go } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# 前端：仅接受网关访问 80（前端再反向代理 /api、/ws 到后端，出站不受本策略限制）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-frontend
spec:
  podSelector:
    matchLabels: { app: pacc-frontend }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: pacc-gateway } }
      ports:
        - { protocol: TCP, port: 80 }
{{- if .Values.ai.enabled }}
---
# AI：仅接受后端访问 8000。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-ai
spec:
  podSelector:
    matchLabels: { app: pacc-ai }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: pacc-backend } }
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- if .Values.mysql.enabled }}
---
# MySQL：仅接受后端访问 3306。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacc.fullname" . }}-mysql
spec:
  podSelector:
    matchLabels: { app: pacc-mysql }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: pacc-backend } }
      ports:
        - { protocol: TCP, port: 3306 }
{{- end }}
{{- end }}