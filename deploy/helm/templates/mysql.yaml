{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pacc.fullname" . }}-mysql
  labels:
    app: pacc-mysql
    {{- include "pacc.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pacc.fullname" . }}-mysql
  replicas: 1
  selector:
    matchLabels: { app: pacc-mysql }
  template:
    metadata:
      labels: { app: pacc-mysql }
    spec:
      containers:
        - name: mysql
          image: {{ .Values.images.mysql }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "pacc.fullname" . }}-secrets, key: mysql-root }
            - name: MYSQL_DATABASE
              value: "pacc"
            - name: MYSQL_USER
              value: "pacc"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "pacc.fullname" . }}-secrets, key: mysql-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.resources.mysql | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: mysql }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pacc.fullname" . }}-mysql
{{- end }}