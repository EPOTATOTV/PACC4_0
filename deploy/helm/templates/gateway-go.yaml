{{- if .Values.gatewayGo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacc.fullname" . }}-gateway-go
  labels:
    app: pacc-gateway-go
    {{- include "pacc.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: pacc-gateway-go }
  template:
    metadata:
      labels: { app: pacc-gateway-go }
    spec:
      containers:
        - name: gateway-go
          image: {{ include "pacc.image" (dict "image" .Values.images.gatewayGo "ctx" .) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://{{ include "pacc.fullname" . }}-backend:8080"
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "pacc.fullname" . }}-secrets, key: admin-api-key }
            - name: RATE_RPS
              value: {{ .Values.gatewayGo.rateRps | quote }}
            - name: RATE_BURST
              value: {{ .Values.gatewayGo.rateBurst | quote }}
          resources:
            {{- toYaml .Values.resources.gatewayGo | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacc.fullname" . }}-gateway-go
  labels:
    app: pacc-gateway-go
    {{- include "pacc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gatewayGo.service.type }}
  selector: { app: pacc-gateway-go }
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}