# MySQL（k8s）—— 单实例演示。生产建议使用托管数据库或 Operator。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pacc-mysql
  namespace: pacc
spec:
  serviceName: pacc-mysql
  replicas: 1
  selector:
    matchLabels: { app: pacc-mysql }
  template:
    metadata:
      labels: { app: pacc-mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: pacc-secrets, key: root-password } }
            - name: MYSQL_DATABASE
              value: pacc
            - name: MYSQL_USER
              value: pacc
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: pacc-secrets, key: db-password } }
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: pacc-mysql
  namespace: pacc
spec:
  selector: { app: pacc-mysql }
  clusterIP: None
  ports:
    - port: 3306
      targetPort: 3306