# PACC PTV 后端 Deployment + Service + 玩家端 WSS 入口（Demo / 生产可调）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacc-backend
  namespace: pacc
  labels: { app: pacc-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pacc-backend }
  template:
    metadata:
      labels: { app: pacc-backend }
    spec:
      containers:
        - name: backend
          image: pacc/ptv-backend:4.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://pacc-mysql:3306/pacc?useSSL=false&serverTimezone=Asia/Shanghai
            - name: SPRING_DATASOURCE_USERNAME
              value: pacc
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: pacc-secrets, key: db-password } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: pacc-backend
  namespace: pacc
spec:
  selector: { app: pacc-backend }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacc-frontend
  namespace: pacc
  labels: { app: pacc-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pacc-frontend }
  template:
    metadata:
      labels: { app: pacc-frontend }
    spec:
      containers:
        - name: frontend
          image: pacc/ptv-frontend:4.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pacc-frontend
  namespace: pacc
spec:
  selector: { app: pacc-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pacc-ingress
  namespace: pacc
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "pacc-backend"
spec:
  rules:
    - host: ptv.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: pacc-backend, port: { number: 8080 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: pacc-backend, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: pacc-frontend, port: { number: 80 } } }