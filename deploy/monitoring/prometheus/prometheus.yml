# PACC v4.2 监控栈 Prometheus 配置
# 抓取目标：PTV 后端（actuator/prometheus）、Go 网关（/metrics）、AI 推理服务（/metrics）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'ptv-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ptv-backend:8080']
        labels:
          service: pacc-backend

  - job_name: 'gateway-go'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: pacc-gateway

  - job_name: 'ai-inference'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai:8000']
        labels:
          service: pacc-ai

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
